{% extends "base.html" %}
{% block title %}Change Password — Student Management System{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Change Password</h1>
      <p>Update your account login password.</p>
    </div>
  </div>

  <div class="card" style="max-width: 540px;">
    <form method="POST" action="{{ url_for('change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="field">
          <label for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" required autofocus>
        </div>

        <div class="field">
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" minlength="8" required>
        </div>

        <div class="field">
          <label for="confirm_new_password">Confirm New Password</label>
          <input type="password" id="confirm_new_password" name="confirm_new_password" minlength="8" required>
        </div>
      </div>

      <div class="actions-row" style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
