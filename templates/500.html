{% extends "base.html" %}
{% block title %}500 Server Error — Student Management System{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Server Error</h1>
      <p>Something went wrong on our end.</p>
    </div>
  </div>
  <div class="card" style="text-align: center; padding: 48px 24px;">
    <div style="font-family: var(--font-heading); font-size: 72px; font-style: italic; color: var(--accent); line-height: 1;">500</div>
    <p style="color: var(--text-secondary); margin-top: 12px;">
      Something went wrong on our end. Our team has been notified. Please try again shortly.
    </p>
    <div style="margin-top: 24px;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Back to Dashboard</a>
    </div>
  </div>
{% endblock %}
