{% extends "base.html" %}
{% block title %}Create Fee Due — {{ student.student_name }}{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Create Fee Due</h1>
      <p>Adding a billing record for {{ student.student_name }} ({{ student.student_id }})</p>
    </div>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('fees_create', record_id=student.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">

        <div class="field">
          <label for="amount_due">Amount Due (₹)</label>
          <input type="number"
                 id="amount_due"
                 name="amount_due"
                 min="0.01"
                 step="0.01"
                 value="{{ form.amount_due or '' }}"
                 required>
        </div>

        <div class="field">
          <label for="due_date">Due Date</label>
          <input type="date"
                 id="due_date"
                 name="due_date"
                 value="{{ form.due_date or '' }}"
                 required>
        </div>

      </div>

      <div class="form-footer">
        <button type="submit" class="btn btn-primary">Create Due</button>
        <a href="{{ url_for('student_details', record_id=student.id) }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
