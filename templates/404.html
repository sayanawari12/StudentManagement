{% extends "base.html" %}
{% block title %}404 Not Found — Student Management System{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist.</p>
    </div>
  </div>
  <div class="card" style="text-align: center; padding: 48px 24px;">
    <div style="font-family: var(--font-heading); font-size: 72px; font-style: italic; color: var(--accent); line-height: 1;">404</div>
    <p style="color: var(--text-secondary); margin-top: 12px;">
      This page doesn't exist. It may have been moved or the URL may be incorrect.
    </p>
    <div style="margin-top: 24px;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Back to Dashboard</a>
    </div>
  </div>
{% endblock %}
