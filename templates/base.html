<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        Student MS
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}"
           class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('students') }}"
           class="{{ 'active' if request.endpoint in ['students', 'student_details', 'edit_student'] else '' }}">Students</a>
        <a href="{{ url_for('add_student') }}"
           class="{{ 'active' if request.endpoint == 'add_student' else '' }}">Add student</a>
      </nav>
      <div class="sidebar-footer">
        <a href="{{ url_for('logout') }}">Log out</a>
      </div>
    </aside>

    <main class="main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-list">
            {% for category, message in messages %}
              <li class="flash flash-{{ category }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
