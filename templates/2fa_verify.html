<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Verification — Student Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Student MS</h1>
    <p class="sub">Enter the 6-digit code from your authenticator app.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login_2fa') }}" id="form-2fa-verify">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="code">Authentication Code</label>
        <input type="text"
               id="code"
               name="code"
               inputmode="numeric"
               pattern="[0-9]{6}"
               maxlength="6"
               placeholder="123456"
               required
               autofocus
               autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary" id="btn-verify-2fa">Verify</button>
    </form>

    <p style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center;">
      <a href="{{ url_for('login') }}" style="color: var(--accent, #A9714F);">
        ← Back to login
      </a>
    </p>
  </div>
</body>
</html>
