{% extends "base.html" %}
{% block title %}Create Announcement — Student Management System{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Create Announcement</h1>
      <p>Post an official institutional notice to targeted audiences.</p>
    </div>
    <div class="actions-row">
      <a href="{{ url_for('notices') }}" class="btn btn-outline">← Back to Notices</a>
    </div>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('notice_add') }}" id="form-notice-add">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">

        <div class="field" style="grid-column: 1 / -1;">
          <label for="title">Announcement Title <span style="color:var(--accent)">(max 150 chars)</span></label>
          <input type="text"
                 id="title"
                 name="title"
                 maxlength="150"
                 value="{{ form.title or '' }}"
                 placeholder="e.g. Semester Examination 2026"
                 required>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="General" {% if form.category == 'General' or not form.category %}selected{% endif %}>General</option>
            <option value="Academic" {% if form.category == 'Academic' %}selected{% endif %}>Academic</option>
            <option value="Exam" {% if form.category == 'Exam' %}selected{% endif %}>Exam</option>
            <option value="Fee" {% if form.category == 'Fee' %}selected{% endif %}>Fee</option>
            <option value="Urgent" {% if form.category == 'Urgent' %}selected{% endif %}>Urgent</option>
          </select>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="Normal" {% if form.priority == 'Normal' or not form.priority %}selected{% endif %}>Normal</option>
            <option value="Urgent" {% if form.priority == 'Urgent' %}selected{% endif %}>Urgent</option>
          </select>
        </div>

        <div class="field">
          <label for="target_course">Target Course</label>
          <select id="target_course" name="target_course">
            <option value="" {% if not form.target_course %}selected{% endif %}>All Courses (All Students)</option>
            <option value="BCA" {% if form.target_course == 'BCA' %}selected{% endif %}>BCA</option>
          </select>
        </div>

        <div class="field">
          <label for="target_semester">Target Semester</label>
          <select id="target_semester" name="target_semester">
            <option value="" {% if not form.target_semester %}selected{% endif %}>All Semesters</option>
            <option value="1" {% if form.target_semester == '1' or form.target_semester == 1 %}selected{% endif %}>Semester 1</option>
            <option value="2" {% if form.target_semester == '2' or form.target_semester == 2 %}selected{% endif %}>Semester 2</option>
            <option value="3" {% if form.target_semester == '3' or form.target_semester == 3 %}selected{% endif %}>Semester 3</option>
            <option value="4" {% if form.target_semester == '4' or form.target_semester == 4 %}selected{% endif %}>Semester 4</option>
            <option value="5" {% if form.target_semester == '5' or form.target_semester == 5 %}selected{% endif %}>Semester 5</option>
            <option value="6" {% if form.target_semester == '6' or form.target_semester == 6 %}selected{% endif %}>Semester 6</option>
          </select>
        </div>

        <div class="field">
          <label for="status">Publication Status</label>
          <select id="status" name="status">
            <option value="Published" {% if form.status == 'Published' or not form.status %}selected{% endif %}>Published</option>
            <option value="Draft" {% if form.status == 'Draft' %}selected{% endif %}>Draft (Hidden from students)</option>
          </select>
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <label for="body">Announcement Content</label>
          <textarea id="body"
                    name="body"
                    rows="7"
                    placeholder="Write the full announcement text here…"
                    required>{{ form.body or '' }}</textarea>
        </div>

      </div>

      <div class="form-footer">
        <button type="submit" class="btn btn-primary" id="btn-post-notice">Post Announcement</button>
        <a href="{{ url_for('notices') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
